name: Deploy to GitHub Pages

# Every push to main rebuilds and redeploys. The build runs `prebuild`, which
# pulls the latest Substack articles and re-bakes the Media Kit snapshot from
# the published sheet — so a deploy also refreshes that data. Both fall back to
# the committed snapshots if a fetch fails, and the build does not break.
on:
  push:
    branches: [main]
  # Nothing on the site fetches Substack at load time — the browser cannot read
  # /feed, which sends no Access-Control-Allow-Origin. So prebuild fetches the
  # feed here, where there is no browser to enforce it, and bakes the result
  # into src/data/*Articles.ts. Same for the audience figures in
  # src/data/audienceStats.ts. Both are frozen until the next build, which is
  # what this schedule is for.
  #
  # Wednesday 15:00 UTC: Decoding AI publishes Tuesday mornings, so this picks
  # up each new issue about a day later.
  #
  # (The Media Kit page is unaffected either way: it reads the published sheet
  # in the browser on every visit.)
  #
  # NOTE: GitHub disables scheduled workflows after 60 days with no repo
  # activity, silently, and may drop or delay a run under load. Weekly means a
  # missed run costs a full week — workflow_dispatch below reruns it by hand.
  schedule:
    - cron: '0 15 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
